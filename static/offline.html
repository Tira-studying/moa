<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#18786b" />
    <title>연결 확인 · 모아</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #202735;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        max-width: 420px;
        margin: 24px;
        padding: 28px;
        background: white;
        border-radius: 24px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 1.7;
      }
      a {
        display: inline-block;
        padding: 14px 20px;
        border-radius: 12px;
        background: #18786b;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- 이 문서는 모든 사용자에게 동일하며 금융 내역·계정 정보를 포함하지 않습니다. -->
    <main>
      <strong>모아</strong>
      <h1>모아에 연결할 수 없어요</h1>
      <p>인터넷과 Tailscale 연결을 확인해 주세요. 서버가 실행 중이어야 내역을 볼 수 있습니다.</p>
      <p>
        모아는 거래 내역이나 명세서를 오프라인 캐시에 저장하지 않습니다. 연결한 뒤 다시 열어 주세요.
      </p>
      <a href="/">다시 연결하기</a>
    </main>
  </body>
</html>
